name: Trunk check

on:
  workflow_call:
    inputs:
      check_mode:
        description: Trunk check-mode
        required: false
        type: string
      arguments:
        description: Trunk extra arguments
        required: false
        type: string
    secrets:
      TRUNK_TOKEN:
        required: true

jobs:
  trunk-code-quality:
    runs-on: ubuntu-latest
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project to system's python
        run: |
          UV_PROJECT_ENVIRONMENT=$pythonLocation \
          uv sync \
            --python=${{ env.pythonLocation }}/bin/python3 \
            --all-extras \
            --dev \
            --frozen \
            --no-install-project

      - name: Trunk Check
        uses: trunk-io/trunk-action@v2.0.0
        with:
          trunk-token: ${{ secrets.TRUNK_TOKEN }}
          check-mode: ${{ inputs.check_mode }}
          arguments: ${{ inputs.arguments }}
